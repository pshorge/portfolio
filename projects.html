<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta
    name="description"
    content="Wybrane projekty i realizacje Pawła Hanejko."
  >

  <title>Realizacje — Paweł Hanejko</title>

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header class="site-header">
  <div class="container nav">

    <a class="brand" href="./">
      Paweł Hanejko
    </a>

    <nav class="nav-links">
      <a href="./">Strona główna</a>

      <a
        href="assets/Pawel_Hanejko_CV.pdf"
        target="_blank"
        rel="noopener"
      >
        CV ↗
      </a>
    </nav>

  </div>
</header>


<main>

  <section class="projects-hero">

    <div class="container">

      <div class="eyebrow">
        Portfolio
      </div>

      <h1>
        Realizacje
      </h1>

      <p class="lead">
        Projekty mobilne, webowe i desktopowe, gry,
        rozwiązania muzealne oraz systemy interaktywne.
      </p>

    </div>

  </section>


  <section class="section">

    <div class="container">

      <div class="filters">

        <div class="filter-group">

          <div class="filter-label">
            Kategoria
          </div>

          <button
            class="filter-button active"
            data-filter="category"
            data-value="All"
          >
            Wszystkie
          </button>

          <button
            class="filter-button"
            data-filter="category"
            data-value="Mobile"
          >
            Mobile
          </button>

          <button
            class="filter-button"
            data-filter="category"
            data-value="Web"
          >
            Web
          </button>

          <button
            class="filter-button"
            data-filter="category"
            data-value="Desktop"
          >
            Desktop
          </button>

          <button
            class="filter-button"
            data-filter="category"
            data-value="Museums & Interactive"
          >
            Muzea / Interactive
          </button>

          <button
            class="filter-button"
            data-filter="category"
            data-value="Games"
          >
            Gry
          </button>

          <button
            class="filter-button"
            data-filter="category"
            data-value="Events"
          >
            Eventy
          </button>

        </div>


        <div class="filter-group">

          <div class="filter-label">
            Technologia
          </div>

          <button
            class="filter-button active"
            data-filter="technology"
            data-value="All"
          >
            Wszystkie
          </button>

          <button
            class="filter-button"
            data-filter="technology"
            data-value="Rust"
          >
            Rust
          </button>

          <button
            class="filter-button"
            data-filter="technology"
            data-value="Tauri"
          >
            Tauri
          </button>

          <button
            class="filter-button"
            data-filter="technology"
            data-value="Unity"
          >
            Unity
          </button>

          <button
            class="filter-button"
            data-filter="technology"
            data-value="Kotlin"
          >
            Kotlin
          </button>

          <button
            class="filter-button"
            data-filter="technology"
            data-value="Android"
          >
            Android
          </button>

          <button
            class="filter-button"
            data-filter="technology"
            data-value="iOS"
          >
            iOS
          </button>

          <button
            class="filter-button"
            data-filter="technology"
            data-value="Stripe"
          >
            Stripe
          </button>

        </div>

      </div>


      <div
        class="projects-grid"
        id="projects-grid"
      ></div>

    </div>

  </section>

</main>


<footer class="footer">
  <div class="container">
    Paweł Hanejko · Software Developer
  </div>
</footer>


<script src="js/projects.js"></script>
<script src="js/site.js"></script>

</body>
</html>
